plugins {
    id 'fabric-loom' version '1.15.5'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = 'bpmelodies.refmap.json'
    }
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.parchmentmc.org' }
    maven {
        url 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven { url 'https://cursemaven.com' }
    maven { url 'https://mvn.devos.one/snapshots/' }
    maven { url 'https://mvn.devos.one/releases/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment "org.parchmentmc.data:parchment-${parchment_mc}:${parchment_version}@zip"
    }
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    modCompileOnly "maven.modrinth:immersive-melodies:0.6.4+1.21.1"
    modCompileOnly "maven.modrinth:sophisticated-core-(unofficial-fabric-port):1.21.1-1.2.9.21.168"
    modCompileOnly "maven.modrinth:sophisticated-backpacks-(unoffical-fabric-port):1.21.1-3.23.4.3.106"
    // TB fabric — curse, modrinth maven serves the neoforge jar
    modCompileOnly "curse.maven:travelers-backpack-fabric-541171:8120695"
    // porting-lib transfer — SC dep, no pom on modrinth
    modCompileOnly "io.github.fabricators_of_create.Porting-Lib:transfer:3.1.0-beta.85+1.21.1"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mod_name', mod_name
    inputs.property 'mod_license', mod_license
    inputs.property 'mod_authors', mod_authors
    inputs.property 'mod_description', mod_description

    filesMatching('fabric.mod.json') {
        expand([
                version: project.version,
                mod_id: mod_id,
                mod_name: mod_name,
                mod_license: mod_license,
                mod_authors: mod_authors,
                mod_description: mod_description,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
