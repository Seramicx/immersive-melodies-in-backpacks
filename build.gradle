plugins {
    id 'fabric-loom' version '1.12.7'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = 'bpmelodies.refmap.json'
    }
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.parchmentmc.org' }
    maven {
        url 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven { url 'https://cursemaven.com' }
    maven { url 'https://mvn.devos.one/snapshots/' }
    maven { url 'https://mvn.devos.one/releases/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment "org.parchmentmc.data:parchment-${minecraft_version}:${parchment_version}@zip"
    }
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Immersive Melodies (0.6.1+1.20.1)
    modCompileOnly "maven.modrinth:immersive-melodies:0.6.1+1.20.1"
    // Sophisticated Core unofficial fabric (1.2.7.15)
    modCompileOnly "maven.modrinth:sophisticated-core-(unofficial-fabric-port):1.20.1-1.2.7.15.166"
    // Sophisticated Backpacks unofficial fabric (3.23.4.5)
    modCompileOnly "maven.modrinth:sophisticated-backpacks-(unoffical-fabric-port):1.20.1-3.23.4.5.110"
    // Traveler's Backpack fabric — curse, modrinth serves the forge jar for 9.1.53
    modCompileOnly "curse.maven:travelers-backpack-fabric-541171:8154657"
    // Backpacked (fabric-1.20.1-3.0.9)
    modCompileOnly "curse.maven:backpacked-352835:7866679"
    // porting-lib transfer (SC dep, no pom on modrinth)
    modCompileOnly "io.github.fabricators_of_create.Porting-Lib:transfer:2.3.4+1.20.1"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mod_name', mod_name
    inputs.property 'mod_license', mod_license
    inputs.property 'mod_authors', mod_authors
    inputs.property 'mod_description', mod_description

    filesMatching('fabric.mod.json') {
        expand([
                version: project.version,
                mod_id: mod_id,
                mod_name: mod_name,
                mod_license: mod_license,
                mod_authors: mod_authors,
                mod_description: mod_description,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
